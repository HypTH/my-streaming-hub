<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miraculous Ladybug - Free Streaming Hub</title>
  <style>
    /* Reset & Theme Variables */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-dark: #0a0b0d;
      --card-bg: #14161d;
      --accent-red: #e50914;
      --accent-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 0;
    }

    /* Header Styling */
    header {
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      padding: 20px 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logo-area h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(45deg, var(--accent-red), #ff4d4d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .nav-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-blue);
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    /* Video Player Arena */
    .player-section {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(229, 9, 20, 0.15);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .now-playing-title {
      margin-top: 15px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .now-playing-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
    }

    /* Directory Container & Filters */
    .directory-section {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-left: 4px solid var(--accent-red);
      padding-left: 10px;
    }

    /* Streaming Episode Grid */
    .episode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .episode-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .episode-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .thumbnail-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #1a1d24;
    }

    .thumbnail-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Sub/Dub Style Tags */
    .media-tags {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 5px;
      z-index: 2;
    }

    .tag {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .tag-sub { background-color: var(--accent-blue); color: #000; }
    .tag-dub { background-color: var(--accent-red); color: #fff; }

    .card-meta {
      padding: 15px;
    }

    .episode-number {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--accent-red);
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .episode-name {
      font-size: 15px;
      color: var(--text-main);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Footer Details */
    footer {
      text-align: center;
      padding: 40px 20px;
      margin-top: 60px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Site Banner / Top Navigation bar -->
  <header>
    <div class="logo-area">
      <h1>Miraculous Hub</h1>
    </div>
    <div class="nav-badge">
      Free Streaming Portal
    </div>
  </header>

  <!-- Live Cinematic Window Container -->
  <section class="player-section">
    <div class="video-wrapper">
      <!-- Standard YouTube Embed Placeholder. Replace URL or ID when ready -->
      <iframe id="video-stream-engine" src="https://youtube.com" allowfullscreen></iframe>
    </div>
    <h2 id="now-playing-label" class="now-playing-title">Season 1 ? Episode 1: Stormy Weather</h2>
  </section>

  <!-- Complete Media Gallery Core Components -->
  <section class="directory-section">
    <h3 class="section-title">Available Episodes</h3>
    
    <div class="episode-grid">

      <!-- Individual Item Block: Episode 1 -->
      <div class="episode-card" onclick="streamVideo('dQw4w9WgXcQ', 'Season 1 ? Episode 1: Stormy Weather')">
        <div class="thumbnail-box">
          <div class="media-tags">
            <span class="tag tag-sub">Sub</span>
            <span class="tag tag-dub">Dub</span>
          </div>
          <!-- Standard thumbnail placeholder layout image link -->
          <img src="https://youtube.com" alt="Stormy Weather Thumbnail">
        </div>
        <div class="card-meta">
          <div class="episode-number">Season 1 ? Ep 1</div>
          <div class="episode-name">Stormy Weather</div>
        </div>
      </div>

      <!-- Individual Item Block: Episode 2 -->
      <div class="episode-card" onclick="streamVideo('jNQXAC9IVRw', 'Season 1 ? Episode 2: The Bubbler')">
        <div class="thumbnail-box">
          <div class="media-tags">
            <span class="tag tag-sub">Sub</span>
            <span class="tag tag-dub">Dub</span>
          </div>
          <img src="https://youtube.com" alt="The Bubbler Thumbnail">
        </div>
        <div class="card-meta">
          <div class="episode-number">Season 1 ? Ep 2</div>
          <div class="episode-name">The Bubbler</div>
        </div>
      </div>

      <!-- Individual Item Block: Episode 3 -->
      <div class="episode-card" onclick="streamVideo('dQw4w9WgXcQ', 'Season 1 ? Episode 3: The Pharaoh')">
        <div class="thumbnail-box">
          <div class="media-tags">
            <span class="tag tag-sub">Sub</span>
          </div>
          <img src="https://youtube.com" alt="The Pharaoh Thumbnail">
        </div>
        <div class="card-meta">
          <div class="episode-number">Season 1 ? Ep 3</div>
          <div class="episode-name">The Pharaoh</div>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>This is a custom fan-made structural design template inspired by streaming layouts.</p>
  </footer>

  <!-- Native Active Routing Engine Script -->
  <script>
    function streamVideo(videoCode, textLabel) {
      // Switches the central media portal resource location path
      document.getElementById('video-stream-engine').src = "https://youtube.com" + videoCode + "?autoplay=1";
      // Refreshes the display text metadata matching the collection click target
      document.getElementById('now-playing-label').textContent = textLabel;
      // Fluid viewport auto-scroll alignment behavior targeting active screen window top margin
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>

</body>
</html>
